<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ScreenMatch - La plataforma definitiva para descubrir series y películas">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/home.css">
    <title>ScreenMatch - Descubre Series y Películas</title>
</head>

<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <button class="menu-toggle" aria-label="Menú">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <a href="./" class="logo-link">
                    <img src="./img/logo.png" alt="Logo ScreenMatch">
                    <h1>ScreenMatch</h1>
                </a>
            </div>

            <nav class="header__nav">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Buscar series..." aria-label="Buscar">
                    <span class="material-symbols-outlined search-icon">search</span>
                </div>

                <div class="header__controls">
                    <div class="category-wrapper">
                        <select data-categorias class="category-select" aria-label="Filtrar por categoría">
                            <option value="todos">Todas las categorías</option>
                            <option value="comedia">Comedia</option>
                            <option value="acción">Acción</option>
                            <option value="crimen">Crimen</option>
                            <option value="drama">Drama</option>
                            <option value="aventura">Aventura</option>
                        </select>
                    </div>

                    <div class="header__opciones">
                        <button class="icon-btn" aria-label="Notificaciones">
                            <span class="material-symbols-outlined">notifications</span>
                        </button>
                        <button class="icon-btn" aria-label="Perfil">
                            <span class="material-symbols-outlined">account_circle</span>
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section data-name="lanzamientos" class="section">
            <div class="section__header">
                <h2>🎬 Últimos Lanzamientos</h2>
            </div>
            <div class="section__content"></div>
        </section>

        <section data-name="top5" class="section">
            <div class="section__header">
                <h2>⭐ Títulos Populares</h2>
            </div>
            <div class="section__content"></div>
        </section>

        <section data-name="series" class="section">
            <div class="section__header">
                <h2>📺 Todas las Series</h2>
            </div>
            <div class="section__content"></div>
        </section>

        <section data-name="categoria" class="hidden pesquisa">
            <div class="section__header">
                <h2 id="categoria-titulo">Resultados de Búsqueda</h2>
            </div>
            <div class="section__content"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 ScreenMatch. Todos los derechos reservados.</p>
    </footer>

    <script src="./scripts/index.js" type="module"></script>
</body>

</html>
